# Parameters for the safety_core wrapper nodes.
# These mirror the safety_core::config::SystemConfig used in the C++ library
# and the AGV demo example, so behavior is reproducible across environments.

safety_envelope_node:
  ros__parameters:
    # Motion envelope (adjusted for human-robot interaction)
    envelope.max_speed_mps: 1.5
    envelope.max_accel_mps2: 0.75
    envelope.max_comfort_decel_mps2: 1.0
    envelope.control_latency_s: 0.04
    envelope.safety_buffer_m: 1.0  # Increased from 0.30 to 1.0m for human-robot interaction

    # Robot footprint (used by safety_core::safety::evaluate_stop_distance overload)
    footprint.length_m: 0.80
    footprint.width_m: 0.60
    footprint.front_overhang_m: 0.10

    # Lateral corridor (added to footprint half-width for forward-cone scan filtering)
    corridor_half_width_m: 0.40
    scan_min_valid_range_m: 0.05
    scan_ignore_min_range_m: 0.5  # Ignore obstacles closer than 0.5m (workers on robot)
    startup_grace_period_s: 2.0  # Grace period to allow sensor stabilization on startup
    base_frame: "base_link"
    envelope.dynamic_buffer_enabled: true
    envelope.velocity_factor: 0.3
    envelope.min_buffer_m: 0.5

sensor_monitor_node:
  ros__parameters:
    lidar_expected_rate: 10.0
    imu_expected_rate: 100.0
    gps_expected_rate: 10.0
    odometry_expected_rate: 50.0
    publish_period_s: 1.0
    healthy_threshold: 0.8
    degraded_threshold: 0.5

safety_supervisor_node:
  ros__parameters:
    localization_timeout_s: 0.5
    auto_recover_from_obstacle: true
    sensor_timeout_s: 1.0
    degraded_recovery_s: 5.0

safety_drive_bridge_node:
  ros__parameters:
    max_linear_mps: 1.5
    max_angular_radps: 1.5
    max_decel_mps2: 1.0
    max_jerk_mps3: 2.0
    cmd_freshness_s: 0.25
    control_period_s: 0.05
