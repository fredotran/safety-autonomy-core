# SLAM Toolbox configuration optimized for warehouse environments.
# Warehouse characteristics: structured environment, long corridors, regular features.

slam_toolbox:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 3.0  # More frequent updates for warehouse mapping
    resolution: 0.05
    max_laser_range: 20.0  # Extended range for large warehouses
    minimum_time_interval: 0.3  # Faster processing for warehouse navigation
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3  # Reduced for warehouse precision
    minimum_travel_heading: 0.3
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 15.0  # Larger buffer for warehouse corridors
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 2.0  # Increased for warehouse environments
    loop_search_maximum_distance: 5.0  # Extended loop closure for warehouses
    do_loop_closing: true
    loop_match_minimum_chain_size: 15  # Increased for reliable loop closure
    loop_match_maximum_variance_coarse: 4.0
    loop_match_minimum_response_coarse: 0.3
    loop_match_minimum_response_fine: 0.4
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 10.0  # Extended for large warehouses
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.3  # Reduced for better warehouse matching
    angle_variance_penalty: 0.8
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true