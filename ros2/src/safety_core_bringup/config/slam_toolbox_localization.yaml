# SLAM Toolbox configuration for localization mode (after initial mapping).
# Optimized for real-time localization in known environments.

slam_toolbox:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    odom_frame: odom
    map_file_name: /workspace/ros2_ws/src/safety_core_bringup/maps/warehouse_map  # Path to map file
    map_start_at_dock: true
    map_start_pose: [0.0, 0.0, 0.0]  # Starting pose [x, y, theta]
    map_config_file: /workspace/ros2_ws/src/safety_core_bringup/maps/warehouse_map.yaml
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    resolution: 0.05
    max_laser_range: 20.0
    minimum_time_interval: 0.1  # Faster updates for real-time localization
    transform_timeout: 0.1
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false  # Disabled for localization
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 3  # Smaller buffer for faster localization
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: false  # Disabled in localization mode
    correlation_search_space_dimension: 0.3  # Smaller for faster matching
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true