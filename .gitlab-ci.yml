stages:
  - format
  - lint
  - test
  - secret-detection

image: ubuntu:24.04

variables:
  BUILD_DIR: build
  CMAKE_FLAGS: "-DCMAKE_BUILD_TYPE=RelWithDebInfo -DSAFETY_CORE_ENABLE_SANITIZERS=ON"
  SECRET_DETECTION_ENABLED: "true"

before_script:
  - apt-get update -y
  - apt-get install -y --no-install-recommends build-essential cmake ninja-build clang clang-tidy clang-format git ca-certificates

format_check:
  stage: format
  script:
    - echo "Running clang-format check"
    - clang-format --version
    - clang-format --dry-run --Werror $(find include src tests -name '*.hpp' -o -name '*.cpp')

clang_tidy:
  stage: lint
  script:
    - cmake -S . -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Debug -DSAFETY_CORE_ENABLE_SANITIZERS=OFF
    - cmake --build ${BUILD_DIR} --target safety_core
    - clang-tidy -p ${BUILD_DIR} $(find src include -name '*.cpp')

build_and_test:
  stage: test
  script:
    - cmake -S . -B ${BUILD_DIR} ${CMAKE_FLAGS}
    - cmake --build ${BUILD_DIR}
    - ctest --test-dir ${BUILD_DIR} --output-on-failure

sast:
  stage: test

secret_detection:
  stage: secret-detection

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
