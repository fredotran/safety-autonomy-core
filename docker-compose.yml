version: '3.8'

services:
  safety-autonomy-demo:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: safety-autonomy-core:latest
    container_name: safety-autonomy-demo
    
    # Environment variables
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=0
      # RMW_IMPLEMENTATION=rmw_cyclonedds_cpp  # Uncomment if installed
      - PYTHONUNBUFFERED=1
      # NVIDIA-specific variables (uncomment if using NVIDIA runtime)
      # - NVIDIA_DRIVER_CAPABILITIES=all
      # - NVIDIA_VISIBLE_DEVICES=all
    
    # Network configuration for ROS2
    network_mode: host
    
    # Display forwarding for GUI applications (Gazebo, RViz)
    volumes:
      # Mount X11 socket for display forwarding
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount X11 authorization
      - ${XAUTHORITY:-/home/$USER/.Xauthority}:/root/.Xauthority:rw
      # Mount the entire repository for development
      - .:/workspace/safety-autonomy-core:rw
      # Persistent build artifacts
      - ros2-build:/workspace/ros2_ws/build
      - ros2-install:/workspace/ros2_ws/install
      - ros2-log:/workspace/ros2_ws/log
    
    # Resource limits (basic CPU/memory limits)
    # Note: Advanced reservations require Docker Swarm or specific Compose versions
    # For basic usage, these limits help prevent resource exhaustion
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 8G
    
    # Privileged mode for hardware access (sensors, etc.)
    privileged: true
    
    # Capabilities for hardware access
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    
    # Devices for sensor access (if using real hardware)
    devices:
      # - /dev/dri:/dev/dri  # Uncomment for GPU support
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyACM0:/dev/ttyACM0
    
    # Working directory
    working_dir: /workspace/ros2_ws
    
    # Health check for production monitoring
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "source /opt/ros/jazzy/setup.bash && source /workspace/ros2_ws/install/setup.bash && ros2 node list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Keep container running
    stdin_open: true
    tty: true
    
    # Restart policy for production reliability
    restart: unless-stopped
    
    # Command to run by default
    command: /bin/bash

volumes:
  ros2-build:
  ros2-install:
  ros2-log:
