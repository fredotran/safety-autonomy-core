name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          # Pinned to repo-local config files so versioning rules can evolve in-tree.
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
