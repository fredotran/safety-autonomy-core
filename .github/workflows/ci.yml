name: CI

on:
  push:
    branches:
      - main
      - "ec/**"
      - "devin/**"
      - "feature/**"
      - "fix/**"
      - "ci/**"
  pull_request:
    branches:
      - main
      - "ec/**"
      - "feature/**"
      - "fix/**"
      - "ci/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  BUILD_DIR: build
  CMAKE_FLAGS: "-DCMAKE_BUILD_TYPE=RelWithDebInfo -DSAFETY_CORE_ENABLE_SANITIZERS=ON"
  COVERAGE_MIN_LINE: "80"
  COVERAGE_MIN_BRANCH: "55"

jobs:
  format_check:
    name: format_check (clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format --dry-run --Werror
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format
          clang-format --version
          clang-format --dry-run --Werror $(find include src tests ros2/src -name '*.hpp' -o -name '*.cpp')

  clang_tidy:
    name: clang_tidy (static analysis + cppcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Pre-existing readability/bugprone findings in the core C++ library; tracked as known
    # debt and intentionally non-blocking until a dedicated cleanup pass lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang clang-tidy cppcheck libeigen3-dev
      - name: Configure
        run: |
          cmake -S . -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Debug -DSAFETY_CORE_ENABLE_SANITIZERS=OFF
      - name: Build safety_core
        run: cmake --build ${BUILD_DIR} --target safety_core
      - name: Run cppcheck with MISRA-like rules
        run: |
          cppcheck --enable=all \
                   --inline-suppr \
                   --std=c++20 \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --suppressions-list=.cppcheck-suppressions \
                   -I include \
                   -I /usr/include/eigen3 \
                   src/ include/ || true
      - name: clang-tidy
        run: clang-tidy -p ${BUILD_DIR} $(find src include -name '*.cpp') || true

  hook_smoke:
    name: hook_smoke (pre-commit hook)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang clang-tidy clang-format git libeigen3-dev
      - name: Configure + build safety_core
        run: |
          cmake -S . -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Debug -DSAFETY_CORE_ENABLE_SANITIZERS=OFF
          cmake --build ${BUILD_DIR} --target safety_core
      - name: Configure git identity (required by hook-driven commits)
        run: |
          git config user.email "ci@safety-autonomy-core"
          git config user.name "CI"
      - name: Run pre-commit hook
        run: |
          git config core.hooksPath .githooks
          printf "\n" >> tests/pid_controller_tests.cpp
          git add tests/pid_controller_tests.cpp
          AUTO_FIX_FORMAT=1 BUILD_DIR=${BUILD_DIR} .githooks/pre-commit
          git checkout -- tests/pid_controller_tests.cpp
          git reset tests/pid_controller_tests.cpp

  policy_guard:
    name: policy_guard (banned API check)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run policy verifier
        run: |
          chmod +x tools/safety/verify_policy.sh
          tools/safety/verify_policy.sh

  safety_case_guard:
    name: safety_case_guard (artifact presence)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run safety case verifier
        run: |
          chmod +x tools/safety/verify_safety_case.sh
          tools/safety/verify_safety_case.sh

  build_and_test:
    name: build_and_test (sanitizers + ctest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang clang-tidy clang-format gcovr ccache \
            libeigen3-dev
      - name: Configure
        run: cmake -S . -B ${BUILD_DIR} ${CMAKE_FLAGS}
      - name: Build
        run: cmake --build ${BUILD_DIR}
      - name: No-heap symbol guard
        run: |
          for UNIT in context_factory.cpp.o task_executor.cpp.o safety_pid.cpp.o state_machine.cpp.o trajectory.cpp.o bounded_ekf_filter.cpp.o complementary_filter.cpp.o safety_supervisor.cpp.o; do
            OBJ_FILE=$(find ${BUILD_DIR}/CMakeFiles/safety_core.dir -name "${UNIT}" | head -n 1)
            test -n "${OBJ_FILE}"
            if nm -u "${OBJ_FILE}" | grep -E -q '(_Znwm|_Znam|malloc|calloc|realloc)(@@.*)?$'; then
              echo "[FAIL] ${UNIT} references heap-allocation symbols"
              nm -u "${OBJ_FILE}"
              exit 1
            fi
          done
      - name: ctest
        run: ctest --test-dir ${BUILD_DIR} --output-on-failure
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ env.BUILD_DIR }}/Testing/
            ${{ env.BUILD_DIR }}/test-results/

  coverage:
    name: coverage (gcovr gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gcovr libeigen3-dev
      - name: Configure (coverage)
        run: cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DSAFETY_CORE_ENABLE_SANITIZERS=OFF -DSAFETY_CORE_ENABLE_COVERAGE=ON
      - name: Build (coverage)
        run: cmake --build build-coverage
      - name: ctest (coverage)
        run: ctest --test-dir build-coverage --output-on-failure
      - name: gcovr gate
        run: |
          gcovr --root . --filter src --filter include --exclude build-coverage \
            --print-summary \
            --fail-under-line ${COVERAGE_MIN_LINE} \
            --fail-under-branch ${COVERAGE_MIN_BRANCH}
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-coverage/coverage.info
            build-coverage/coverage.xml

  docker_build:
    name: docker_build (ROS 2 via Docker Compose with BuildKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=ghcr.io/docker/buildx-buildkit:latest
            network=host
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build Docker image with BuildKit and ROS2 workspace
        run: |
          echo "Building Docker image with ROS2 workspace using BuildKit..."
          docker buildx build \
            --file Dockerfile \
            --target development \
            --tag safety-autonomy-core:latest \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            --progress=plain \
            .
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true
          echo "✓ Docker image built successfully with ROS2 workspace"
      - name: Verify ROS2 packages in built image
        run: |
          echo "Verifying ROS2 packages in built image..."
          docker compose run --rm safety-autonomy-demo bash -c "
            source /opt/ros/jazzy/setup.bash &&
            source /workspace/ros2_ws/install/setup.bash &&
            echo '=== ROS2 Packages ===' &&
            colcon list &&
            echo '' &&
            echo '=== Package Count ===' &&
            colcon list | wc -l &&
            echo 'ROS2 packages built and verified successfully'
          "
      - name: Save Docker image
        run: docker save safety-autonomy-core:latest | gzip > docker-image.tar.gz
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          retention-days: 1

  demo_tests:
    name: demo_tests (comprehensive Docker demo validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: docker_build
    if: |
      contains(github.event.head_commit.message, '[skip-demo]') == false &&
      (contains(github.event.head_commit.message, '[ci skip]') == false ||
       contains(github.event.head_commit.message, '[skip ci]') == false)
    strategy:
      matrix:
        demo_type: [quick, comprehensive, launch_safety, launch_diagnostic]
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load < docker-image.tar.gz
      - name: Check if Docker-related files changed
        id: check_changes
        run: |
          docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
            chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
            /workspace/safety-autonomy-core/tools/ci/validate_demo.sh quick
          "
      - name: Run comprehensive demo validation
        run: |
          docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
            chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
            /workspace/safety-autonomy-core/tools/ci/validate_demo.sh comprehensive
          "
      - name: Run localization stack test
        run: |
          docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
            chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
            /workspace/safety-autonomy-core/tools/ci/validate_demo.sh localization
          "
      - name: Run odometry stack test
        run: |
          docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
            chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
            /workspace/safety-autonomy-core/tools/ci/validate_demo.sh odometry
          "
      - name: Verify safety stack launch (headless)
        run: |
          docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
            chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
            /workspace/safety-autonomy-core/tools/ci/validate_demo.sh launch safety_core_bringup safety_sim.launch.py
          "
      - name: Verify diagnostic mode launch (headless)
        run: |
          docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
            chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
            /workspace/safety-autonomy-core/tools/ci/validate_demo.sh launch safety_core_bringup diagnostics.launch.py
          "
      - name: Upload demo logs
        if: always() && steps.check_changes.outputs.docker_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: demo-logs-${{ matrix.demo_type }}
          path: |
            ~/.ros/log/
            /tmp/*.log
