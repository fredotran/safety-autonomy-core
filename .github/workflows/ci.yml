name: CI

on:
  push:
    branches:
      - main
      - "ec/**"
      - "devin/**"
      - "feature/**"
      - "fix/**"
      - "ci/**"
  pull_request:
    branches:
      - main
      - "ec/**"
      - "feature/**"
      - "fix/**"
      - "ci/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  BUILD_DIR: build
  CMAKE_FLAGS: "-DCMAKE_BUILD_TYPE=RelWithDebInfo -DSAFETY_CORE_ENABLE_SANITIZERS=ON"
  COVERAGE_MIN_LINE: "80"
  # Ratcheted 2026-10-31 from 55 -> 70 after the coverage_gaps/state_machine
  # test pass (measured 75.0% locally). Residual uncovered branches are CAS
  # retry loops, defensive dead branches, and multi-TU inline artifacts.
  COVERAGE_MIN_BRANCH: "70"

jobs:
  format_check:
    name: format_check (clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format --dry-run --Werror
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format
          clang-format --version
          clang-format --dry-run --Werror $(find include src tests ros2/src -name '*.hpp' -o -name '*.cpp')

  clang_tidy:
    name: clang_tidy (static analysis ratchet)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang clang-tidy cppcheck
      - name: Configure
        run: |
          cmake -S . -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSAFETY_CORE_ENABLE_SANITIZERS=OFF
      - name: Static analysis gate
        # Ratchet: fails on NEW findings vs tools/ci/baselines/static_analysis_baseline.txt.
        # Pre-existing debt is baselined and tolerated; shrink it with --update
        # locally after cleanup passes.
        run: tools/ci/static_analysis_gate.sh --build-dir ${BUILD_DIR}

  hook_smoke:
    name: hook_smoke (pre-commit hook)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang clang-tidy clang-format git
      - name: Configure + build safety_core
        run: |
          cmake -S . -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Debug -DSAFETY_CORE_ENABLE_SANITIZERS=OFF
          cmake --build ${BUILD_DIR} --target safety_core
      - name: Configure git identity (required by hook-driven commits)
        run: |
          git config user.email "ci@safety-autonomy-core"
          git config user.name "CI"
      - name: Run pre-commit hook
        run: |
          git config core.hooksPath .githooks
          printf "\n" >> tests/pid_controller_tests.cpp
          git add tests/pid_controller_tests.cpp
          AUTO_FIX_FORMAT=1 BUILD_DIR=${BUILD_DIR} .githooks/pre-commit
          git checkout -- tests/pid_controller_tests.cpp
          git reset tests/pid_controller_tests.cpp

  policy_guard:
    name: policy_guard (banned API check)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run policy verifier
        run: |
          chmod +x tools/safety/verify_policy.sh
          tools/safety/verify_policy.sh

  safety_case_guard:
    name: safety_case_guard (artifact presence)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run safety case verifier
        run: |
          chmod +x tools/safety/verify_safety_case.sh
          tools/safety/verify_safety_case.sh
      - name: Verify hazard->test traceability
        run: python3 tools/safety/verify_traceability.py

  build_and_test:
    name: build_and_test (sanitizers + ctest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang clang-tidy clang-format gcovr ccache \
           
      - name: Configure
        run: cmake -S . -B ${BUILD_DIR} ${CMAKE_FLAGS}
      - name: Build
        run: cmake --build ${BUILD_DIR}
      - name: No-heap symbol guard
        run: |
          for UNIT in context_factory.cpp.o task_executor.cpp.o safety_pid.cpp.o state_machine.cpp.o trajectory.cpp.o bounded_ekf_filter.cpp.o complementary_filter.cpp.o safety_supervisor.cpp.o; do
            OBJ_FILE=$(find ${BUILD_DIR}/CMakeFiles/safety_core.dir -name "${UNIT}" | head -n 1)
            test -n "${OBJ_FILE}"
            if nm -u "${OBJ_FILE}" | grep -E -q '(_Znwm|_Znam|malloc|calloc|realloc)(@@.*)?$'; then
              echo "[FAIL] ${UNIT} references heap-allocation symbols"
              nm -u "${OBJ_FILE}"
              exit 1
            fi
          done
      - name: ctest
        run: ctest --test-dir ${BUILD_DIR} --output-on-failure
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ env.BUILD_DIR }}/Testing/
            ${{ env.BUILD_DIR }}/test-results/

  coverage:
    name: coverage (gcovr gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gcovr
      - name: Configure (coverage)
        run: cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DSAFETY_CORE_ENABLE_SANITIZERS=OFF -DSAFETY_CORE_ENABLE_COVERAGE=ON
      - name: Build (coverage)
        run: cmake --build build-coverage
      - name: ctest (coverage)
        run: ctest --test-dir build-coverage --output-on-failure
      - name: gcovr gate
        run: |
          gcovr --root . --filter src --filter include --exclude build-coverage \
            --print-summary \
            --fail-under-line ${COVERAGE_MIN_LINE} \
            --fail-under-branch ${COVERAGE_MIN_BRANCH}
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-coverage/coverage.info
            build-coverage/coverage.xml

  fuzz_smoke:
    name: fuzz_smoke (libFuzzer short campaigns)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang
      - name: Configure (fuzz)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSAFETY_CORE_ENABLE_SANITIZERS=OFF -DSAFETY_CORE_ENABLE_WERROR=OFF \
            -DSAFETY_CORE_ENABLE_FUZZING=ON
      - name: Build fuzzers
        run: cmake --build build-fuzz --target fuzz_env_loader fuzz_filters
      - name: Short fuzz campaign (env_loader)
        run: ./build-fuzz/fuzz_env_loader -max_total_time=60 -timeout=10
      - name: Short fuzz campaign (filters)
        run: ./build-fuzz/fuzz_filters -max_total_time=60 -timeout=10

  benchmarks:
    name: benchmarks (timing evidence)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build
      - name: Configure (release)
        run: cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DSAFETY_CORE_ENABLE_SANITIZERS=OFF
      - name: Build benchmark
        run: cmake --build build-bench --target safety_core_benchmarks
      - name: Run benchmarks (budget gate)
        run: ./build-bench/safety_core_benchmarks --iterations 50000
      - name: Upload timing evidence
        if: always()
        run: ./build-bench/safety_core_benchmarks --iterations 50000 --json > benchmark_results.json
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json

  certifiable_build:
    name: certifiable_build (no-exceptions / no-RTTI partition)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build
      - name: Build certifiable partition
        run: |
          cmake -S . -B build-cert -GNinja
          cmake --build build-cert --target safety_core_certifiable
      - name: Verify no dynamic exception/RTTI symbols
        run: |
          # A certifiable TU must not reference exception-handling machinery.
          ! nm -C build-cert/libsafety_core_certifiable.a 2>/dev/null \
              | grep -E "__cxa_throw|__cxa_begin_catch|typeinfo for" | grep -v " U " | grep -q .
          echo "partition clean: no exception/RTTI definitions"

  sbom:
    name: sbom (software bill of materials)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM / dependency manifest
        run: ./tools/ci/generate_sbom.sh sbom
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  docker_build:
    name: docker_build (ROS 2 via Docker Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker compose build
      - name: Save Docker image
        run: docker save safety-autonomy-core:latest | gzip > docker-image.tar.gz
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          retention-days: 1
      - name: Verify ROS 2 build
        run: |
          docker compose run --rm safety-autonomy-demo bash -c "
            source /opt/ros/jazzy/setup.bash &&
            source /workspace/ros2_ws/install/setup.bash &&
            colcon list &&
            echo 'ROS 2 packages built successfully'
          "

  demo_tests:
    name: demo_tests (comprehensive Docker demo validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: docker_build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load < docker-image.tar.gz
      - name: Run quick demo validation
        run: |
          docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
            chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
            /workspace/safety-autonomy-core/tools/ci/validate_demo.sh quick
          "
      - name: Run comprehensive demo validation
        run: |
          docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
            chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
            /workspace/safety-autonomy-core/tools/ci/validate_demo.sh comprehensive
          "
      - name: Verify safety stack launch
        run: |
          docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
            chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
            /workspace/safety-autonomy-core/tools/ci/validate_demo.sh launch safety_core_bringup safety_sim.launch.py
          "
      - name: Verify diagnostic mode launch
        run: |
          docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
            chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
            /workspace/safety-autonomy-core/tools/ci/validate_demo.sh launch safety_core_bringup diagnostics.launch.py
          "
      - name: Upload demo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-logs
          path: |
            ~/.ros/log/
            /tmp/*.log

  ros2_tests:
    name: ros2_tests (colcon test in built image)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: docker_build
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load < docker-image.tar.gz
      - name: Run ROS 2 package tests
        run: |
          docker run --rm --network host safety-autonomy-core:latest bash -c "
            source /opt/ros/jazzy/setup.bash &&
            cd /workspace/ros2_ws &&
            colcon test --event-handlers console_direct+ &&
            colcon test-result --verbose
          "
