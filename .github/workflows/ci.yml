name: CI

on:
  push:
    branches:
      - main
      - "ec/**"
      - "devin/**"
      - "feature/**"
      - "fix/**"
      - "ci/**"
  pull_request:
    branches:
      - main
      - "ec/**"
      - "feature/**"
      - "fix/**"
      - "ci/**"
  workflow_dispatch:
    inputs:
      run_all_jobs:
        description: 'Force run all CI jobs regardless of path filters'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write
  packages: write

env:
  BUILD_DIR: build
  CMAKE_FLAGS: "-DCMAKE_BUILD_TYPE=RelWithDebInfo -DSAFETY_CORE_ENABLE_SANITIZERS=ON -G Ninja"
  COVERAGE_MIN_LINE: "80"
  COVERAGE_MIN_BRANCH: "55"
  CCACHE_DIR: /tmp/ccache
  APT_CACHE_DIR: /var/cache/apt
  # Improved cache keys for better hit rates
  CACHE_VERSION: "v3"

jobs:
  # Stage 1: Detect changes and determine which jobs to run
  detect_changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      cpp: ${{ steps.changes.outputs.cpp }}
      docker: ${{ steps.changes.outputs.docker }}
      docs: ${{ steps.changes.outputs.docs }}
      ci: ${{ steps.changes.outputs.ci }}
      run_all: ${{ steps.force.outputs.run_all }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed files
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            cpp:
              - 'include/**'
              - 'src/**'
              - 'tests/**'
              - 'ros2/src/**'
              - 'CMakeLists.txt'
              - '*.cmake'
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.dockerignore'
              - 'ros2/**'
            docs:
              - '**.md'
              - 'docs/**'
              - 'markdown/**'
            ci:
              - '.github/workflows/**'
              - '.githooks/**'
      - name: Force run all jobs if requested
        id: force
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.run_all_jobs }}" = "true" ]; then
            echo "run_all=true" >> $GITHUB_OUTPUT
          else
            echo "run_all=false" >> $GITHUB_OUTPUT
          fi
      - name: Summary of changes
        run: |
          echo "C++ changes: ${{ steps.changes.outputs.cpp }}"
          echo "Docker changes: ${{ steps.changes.outputs.docker }}"
          echo "Docs changes: ${{ steps.changes.outputs.docs }}"
          echo "CI changes: ${{ steps.changes.outputs.ci }}"
          echo "Force run all: ${{ steps.force.outputs.run_all }}"

  # Stage 2: Quality checks (always run if CI changed or forced)
  format_check:
    name: format_check (clang-format)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: detect_changes
    if: |
      (needs.detect_changes.outputs.cpp == 'true' || needs.detect_changes.outputs.ci == 'true' || needs.detect_changes.outputs.run_all == 'true') &&
      (contains(github.event.head_commit.message, '[skip-format]') == false &&
       contains(github.event.head_commit.message, '[ci skip]') == false &&
       contains(github.event.head_commit.message, '[skip ci]') == false)
    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format --dry-run --Werror
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format
          clang-format --version
          clang-format --dry-run --Werror $(find include src tests ros2/src -name '*.hpp' -o -name '*.cpp')

  clang_tidy:
    name: clang_tidy (static analysis + cppcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: detect_changes
    # Pre-existing readability/bugprone findings in the core C++ library; tracked as known
    # debt and intentionally non-blocking until a dedicated cleanup pass lands.
    continue-on-error: true
    if: |
      (needs.detect_changes.outputs.cpp == 'true' || needs.detect_changes.outputs.ci == 'true' || needs.detect_changes.outputs.run_all == 'true') &&
      (contains(github.event.head_commit.message, '[skip-tidy]') == false &&
       contains(github.event.head_commit.message, '[ci skip]') == false &&
       contains(github.event.head_commit.message, '[skip ci]') == false)
    steps:
      - uses: actions/checkout@v4
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ env.CACHE_VERSION }}-${{ runner.os }}-clang-tidy-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ccache-${{ env.CACHE_VERSION }}-${{ runner.os }}-clang-tidy-
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: apt-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'Dockerfile') }}
          restore-keys: |
            apt-${{ env.CACHE_VERSION }}-${{ runner.os }}-
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang clang-tidy cppcheck ccache libeigen3-dev
      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -s
      - name: Configure
        run: |
          cmake -S . -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Debug -DSAFETY_CORE_ENABLE_SANITIZERS=OFF -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build safety_core
        run: cmake --build ${BUILD_DIR} --target safety_core --parallel $(nproc)
      - name: Show ccache stats
        run: ccache -s
      - name: Run cppcheck with MISRA-like rules
        run: |
          cppcheck --enable=all \
                   --inline-suppr \
                   --std=c++20 \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --suppressions-list=.cppcheck-suppressions \
                   -I include \
                   -I /usr/include/eigen3 \
                   src/ include/ || true
      - name: clang-tidy
        run: clang-tidy -p ${BUILD_DIR} $(find src include -name '*.cpp') || true

  hook_smoke:
    name: hook_smoke (pre-commit hook)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: detect_changes
    if: |
      (needs.detect_changes.outputs.cpp == 'true' || needs.detect_changes.outputs.ci == 'true' || needs.detect_changes.outputs.run_all == 'true') &&
      (contains(github.event.head_commit.message, '[skip-hook]') == false &&
       contains(github.event.head_commit.message, '[ci skip]') == false &&
       contains(github.event.head_commit.message, '[skip ci]') == false)
    steps:
      - uses: actions/checkout@v4
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ env.CACHE_VERSION }}-${{ runner.os }}-hook-smoke-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ccache-${{ env.CACHE_VERSION }}-${{ runner.os }}-hook-smoke-
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: apt-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'Dockerfile') }}
          restore-keys: |
            apt-${{ env.CACHE_VERSION }}-${{ runner.os }}-
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang clang-tidy clang-format git ccache libeigen3-dev
      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -s
      - name: Configure + build safety_core
        run: |
          cmake -S . -B ${BUILD_DIR} -DCMAKE_BUILD_TYPE=Debug -DSAFETY_CORE_ENABLE_SANITIZERS=OFF -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build ${BUILD_DIR} --target safety_core --parallel $(nproc)
      - name: Show ccache stats
        run: ccache -s
      - name: Configure git identity (required by hook-driven commits)
        run: |
          git config user.email "ci@safety-autonomy-core"
          git config user.name "CI"
      - name: Run pre-commit hook
        run: |
          git config core.hooksPath .githooks
          printf "\n" >> tests/pid_controller_tests.cpp
          git add tests/pid_controller_tests.cpp
          AUTO_FIX_FORMAT=1 BUILD_DIR=${BUILD_DIR} .githooks/pre-commit
          git checkout -- tests/pid_controller_tests.cpp
          git reset tests/pid_controller_tests.cpp

  # Stage 2: Safety guards (always run for safety-critical project)
  policy_guard:
    name: policy_guard (banned API check)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: detect_changes
    if: always() && needs.detect_changes.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Run policy verifier
        run: |
          if [ -f tools/safety/verify_policy.sh ]; then
            chmod +x tools/safety/verify_policy.sh
            tools/safety/verify_policy.sh
          else
            echo "Warning: verify_policy.sh not found, skipping policy check"
            exit 0
          fi

  safety_case_guard:
    name: safety_case_guard (artifact presence)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: detect_changes
    if: always() && needs.detect_changes.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Run safety case verifier
        run: |
          if [ -f tools/safety/verify_safety_case.sh ]; then
            chmod +x tools/safety/verify_safety_case.sh
            tools/safety/verify_safety_case.sh
          else
            echo "Warning: verify_safety_case.sh not found, skipping safety case check"
            exit 0
          fi

  # Stage 3: Build and test C++ library
  build_and_test:
    name: build_and_test (sanitizers + ctest)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: detect_changes
    if: |
      (needs.detect_changes.outputs.cpp == 'true' || needs.detect_changes.outputs.ci == 'true' || needs.detect_changes.outputs.run_all == 'true') &&
      (contains(github.event.head_commit.message, '[skip-build]') == false &&
       contains(github.event.head_commit.message, '[ci skip]') == false &&
       contains(github.event.head_commit.message, '[skip ci]') == false)
    steps:
      - uses: actions/checkout@v4
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ env.CACHE_VERSION }}-${{ runner.os }}-build-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ccache-${{ env.CACHE_VERSION }}-${{ runner.os }}-build-
      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}
            build-coverage
          key: cmake-${{ env.CACHE_VERSION }}-${{ runner.os }}-build-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'src/**', 'include/**') }}
          restore-keys: |
            cmake-${{ env.CACHE_VERSION }}-${{ runner.os }}-build-
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: apt-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'Dockerfile') }}
          restore-keys: |
            apt-${{ env.CACHE_VERSION }}-${{ runner.os }}-
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang clang-tidy clang-format gcovr ccache libeigen3-dev
      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -s
      - name: Configure
        run: |
          cmake -S . -B ${BUILD_DIR} ${CMAKE_FLAGS} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build with timing
        run: cmake --build ${BUILD_DIR} --parallel $(nproc) -- -v
      - name: Show ccache stats
        run: ccache -s
      - name: No-heap symbol guard
        run: |
          for UNIT in context_factory.cpp.o task_executor.cpp.o safety_pid.cpp.o state_machine.cpp.o trajectory.cpp.o bounded_ekf_filter.cpp.o complementary_filter.cpp.o safety_supervisor.cpp.o; do
            OBJ_FILE=$(find ${BUILD_DIR}/CMakeFiles/safety_core.dir -name "${UNIT}" | head -n 1)
            test -n "${OBJ_FILE}"
            if nm -u "${OBJ_FILE}" | grep -E -q '(_Znwm|_Znam|malloc|calloc|realloc)(@@.*)?$'; then
              echo "[FAIL] ${UNIT} references heap-allocation symbols"
              nm -u "${OBJ_FILE}"
              exit 1
            fi
          done
      - name: ctest with parallel execution
        run: ctest --test-dir ${BUILD_DIR} --output-on-failure --parallel $(nproc) --schedule-random
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ env.BUILD_DIR }}/Testing/
            ${{ env.BUILD_DIR }}/test-results/

  coverage:
    name: coverage (gcovr gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: detect_changes
    env:
      CC: gcc
      CXX: g++
    if: |
      (needs.detect_changes.outputs.cpp == 'true' || needs.detect_changes.outputs.ci == 'true' || needs.detect_changes.outputs.run_all == 'true') &&
      (contains(github.event.head_commit.message, '[skip-coverage]') == false &&
       contains(github.event.head_commit.message, '[ci skip]') == false &&
       contains(github.event.head_commit.message, '[skip ci]') == false)
    steps:
      - uses: actions/checkout@v4
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ env.CACHE_VERSION }}-${{ runner.os }}-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ccache-${{ env.CACHE_VERSION }}-${{ runner.os }}-coverage-
      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: build-coverage
          key: cmake-${{ env.CACHE_VERSION }}-${{ runner.os }}-coverage-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'src/**', 'include/**') }}
          restore-keys: |
            cmake-${{ env.CACHE_VERSION }}-${{ runner.os }}-coverage-
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: apt-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', 'Dockerfile') }}
          restore-keys: |
            apt-${{ env.CACHE_VERSION }}-${{ runner.os }}-
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gcovr ccache libeigen3-dev
      - name: Configure ccache
        run: |
          ccache -M 5G
          ccache -s
      - name: Configure (coverage)
        run: |
          cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DSAFETY_CORE_ENABLE_SANITIZERS=OFF \
            -DSAFETY_CORE_ENABLE_COVERAGE=ON -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (coverage)
        run: cmake --build build-coverage --parallel $(nproc)
      - name: Show ccache stats
        run: ccache -s
      - name: ctest (coverage)
        run: ctest --test-dir build-coverage --output-on-failure --parallel $(nproc) --schedule-random
      - name: gcovr gate
        run: |
          gcovr --root . --filter src --filter include --exclude build-coverage \
            --print-summary \
            --fail-under-line ${COVERAGE_MIN_LINE} \
            --fail-under-branch ${COVERAGE_MIN_BRANCH}
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build-coverage/coverage.info
            build-coverage/coverage.xml

  # Stage 4: Docker build and security scanning
  docker_build:
    name: docker_build (ROS 2 via Docker Compose with BuildKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: detect_changes
    if: |
      (needs.detect_changes.outputs.docker == 'true' || needs.detect_changes.outputs.cpp == 'true' || needs.detect_changes.outputs.ci == 'true' || needs.detect_changes.outputs.run_all == 'true') &&
      (contains(github.event.head_commit.message, '[skip-docker]') == false &&
       contains(github.event.head_commit.message, '[ci skip]') == false &&
       contains(github.event.head_commit.message, '[skip ci]') == false)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host
      - name: Cache Docker layers (base)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-base
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-buildx-base-${{ hashFiles('Dockerfile', 'ros2/**/package.xml') }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-${{ runner.os }}-buildx-base-
      - name: Cache Docker layers (development)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-dev
          key: ${{ env.CACHE_VERSION }}-${{ runner.os }}-buildx-dev-${{ hashFiles('Dockerfile', 'ros2/**/package.xml', 'ros2/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-${{ runner.os }}-buildx-dev-
      - name: Build Docker base image (cached separately)
        run: |
          echo "Building Docker base image with dependencies..."
          docker buildx build \
            --file Dockerfile \
            --target base \
            --tag safety-autonomy-core:base \
            --cache-from type=local,src=/tmp/.buildx-cache-base \
            --cache-to type=local,dest=/tmp/.buildx-cache-base-new,mode=max \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --progress=plain \
            .
          mv /tmp/.buildx-cache-base-new /tmp/.buildx-cache-base || true
          echo "✓ Base image built successfully"
      - name: Build Docker development image with ROS2 workspace
        run: |
          echo "Building Docker development image with ROS2 workspace using BuildKit..."
          docker buildx build \
            --file Dockerfile \
            --target development \
            --tag safety-autonomy-core:latest \
            --cache-from type=local,src=/tmp/.buildx-cache-dev \
            --cache-from type=local,src=/tmp/.buildx-cache-base \
            --cache-to type=local,dest=/tmp/.buildx-cache-dev-new,mode=max \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --progress=plain \
            .
          mv /tmp/.buildx-cache-dev-new /tmp/.buildx-cache-dev || true
          echo "✓ Docker image built successfully with ROS2 workspace"
      - name: Verify ROS2 packages in built image
        run: |
          echo "Verifying ROS2 packages in built image..."
          docker run --rm safety-autonomy-core:latest bash -c "
            source /opt/ros/jazzy/setup.bash &&
            source /workspace/ros2_ws/install/setup.bash &&
            echo '=== ROS2 Packages ===' &&
            colcon list &&
            echo '' &&
            echo '=== Package Count ===' &&
            colcon list | wc -l &&
            echo 'ROS2 packages built and verified successfully'
          "
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: safety-autonomy-core:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
      - name: Generate SBOM
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --format spdx-json --output sbom.json \
            safety-autonomy-core:latest || echo "SBOM generation failed, continuing..."
      - name: Upload SBOM artifact
        if: hashFiles('sbom.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
      - name: Save Docker image
        run: docker save safety-autonomy-core:latest | gzip > docker-image.tar.gz
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          retention-days: 7
      - name: Generate build metadata
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "GIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "GIT_REF=${{ github.ref }}" >> $GITHUB_ENV
      - name: Create build info artifact
        run: |
          cat > build-info.json << EOF
          {
            "build_date": "${{ env.BUILD_DATE }}",
            "git_sha": "${{ github.sha }}",
            "git_ref": "${{ github.ref }}",
            "docker_image": "safety-autonomy-core:latest",
            "cache_version": "${{ env.CACHE_VERSION }}"
          }
          EOF
      - name: Upload build info artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.json
          retention-days: 90

  # Stage 5: Integration tests
  demo_tests:
    name: demo_tests (${{ matrix.test }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: docker_build
    if: |
      needs.docker_build.result == 'success' &&
      (contains(github.event.head_commit.message, '[skip-demo]') == false &&
       contains(github.event.head_commit.message, '[ci skip]') == false &&
       contains(github.event.head_commit.message, '[skip ci]') == false)
    strategy:
      matrix:
        test: [quick, localization, odometry, launch]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load Docker image
        run: docker load < docker-image.tar.gz
      - name: Run ${{ matrix.test }} test
        run: |
          if [ "${{ matrix.test }}" = "launch" ]; then
            docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
              chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
              /workspace/safety-autonomy-core/tools/ci/validate_demo.sh launch safety_core_bringup safety_sim.launch.py
            "
          else
            docker run --rm --network host -v ${{ github.workspace }}:/workspace/safety-autonomy-core safety-autonomy-core:latest bash -c "
              chmod +x /workspace/safety-autonomy-core/tools/ci/validate_demo.sh &&
              /workspace/safety-autonomy-core/tools/ci/validate_demo.sh ${{ matrix.test }}
            "
          fi
      - name: Upload demo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-logs-${{ matrix.test }}
          path: |
            $HOME/.ros/log/
            /tmp/*.log
          if-no-files-found: ignore

  # Stage 6: CI summary and reporting
  ci_summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [detect_changes, format_check, clang_tidy, hook_smoke, policy_guard, safety_case_guard, build_and_test, coverage, docker_build]
    if: always() && needs.detect_changes.result == 'success'
    steps:
      - name: Check job results
        run: |
          echo "### CI Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

          # Helper function to display job status
          show_job_status() {
            local job_name="$1"
            local job_result="$2"
            case "$job_result" in
              success)
                echo "| $job_name | ✅ $job_result |" >> $GITHUB_STEP_SUMMARY
                ;;
              failure)
                echo "| $job_name | ❌ $job_result |" >> $GITHUB_STEP_SUMMARY
                ;;
              skipped)
                echo "| $job_name | ⏭️ $job_result |" >> $GITHUB_STEP_SUMMARY
                ;;
              *)
                echo "| $job_name | ❓ $job_result |" >> $GITHUB_STEP_SUMMARY
                ;;
            esac
          }

          show_job_status "Detect Changes" "${{ needs.detect_changes.result }}"
          show_job_status "Format Check" "${{ needs.format_check.result }}"
          show_job_status "Clang Tidy" "${{ needs.clang_tidy.result }}"
          show_job_status "Hook Smoke" "${{ needs.hook_smoke.result }}"
          show_job_status "Policy Guard" "${{ needs.policy_guard.result }}"
          show_job_status "Safety Case Guard" "${{ needs.safety_case_guard.result }}"
          show_job_status "Build and Test" "${{ needs.build_and_test.result }}"
          show_job_status "Coverage" "${{ needs.coverage.result }}"
          show_job_status "Docker Build" "${{ needs.docker_build.result }}"

      - name: Changes detected
        run: |
          echo "### Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- C++ changes: ${{ needs.detect_changes.outputs.cpp }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker changes: ${{ needs.detect_changes.outputs.docker }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docs changes: ${{ needs.detect_changes.outputs.docs }}" >> $GITHUB_STEP_SUMMARY
          echo "- CI changes: ${{ needs.detect_changes.outputs.ci }}" >> $GITHUB_STEP_SUMMARY
          echo "- Force run all: ${{ needs.detect_changes.outputs.run_all }}" >> $GITHUB_STEP_SUMMARY

      - name: Overall CI status
        run: |
          echo "### Overall CI Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Track if any critical job failed
          critical_failure=0

          # Check critical jobs
          if [ "${{ needs.detect_changes.result }}" != "success" ]; then
            echo "❌ CI failed at change detection stage" >> $GITHUB_STEP_SUMMARY
            critical_failure=1
          fi

          if [ "${{ needs.policy_guard.result }}" != "success" ] && [ "${{ needs.policy_guard.result }}" != "skipped" ]; then
            echo "❌ CI failed at policy guard" >> $GITHUB_STEP_SUMMARY
            critical_failure=1
          fi

          if [ "${{ needs.safety_case_guard.result }}" != "success" ] && [ "${{ needs.safety_case_guard.result }}" != "skipped" ]; then
            echo "❌ CI failed at safety case guard" >> $GITHUB_STEP_SUMMARY
            critical_failure=1
          fi

          if [ "${{ needs.format_check.result }}" != "success" ] && [ "${{ needs.format_check.result }}" != "skipped" ]; then
            echo "❌ CI failed at format check" >> $GITHUB_STEP_SUMMARY
            critical_failure=1
          fi

          if [ "${{ needs.build_and_test.result }}" != "success" ] && [ "${{ needs.build_and_test.result }}" != "skipped" ]; then
            echo "❌ CI failed at build and test" >> $GITHUB_STEP_SUMMARY
            critical_failure=1
          fi

          if [ "${{ needs.docker_build.result }}" != "success" ] && [ "${{ needs.docker_build.result }}" != "skipped" ]; then
            echo "❌ CI failed at docker build" >> $GITHUB_STEP_SUMMARY
            critical_failure=1
          fi

          # Check non-critical jobs (warnings only)
          if [ "${{ needs.clang_tidy.result }}" != "success" ] && [ "${{ needs.clang_tidy.result }}" != "skipped" ]; then
            echo "⚠️ CI warnings at clang-tidy (non-blocking)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ $critical_failure -eq 1 ]; then
            echo "❌ CI failed with critical errors" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ CI passed successfully" >> $GITHUB_STEP_SUMMARY
          fi
