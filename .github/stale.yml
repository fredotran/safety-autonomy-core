# Close inactive PRs automatically
daysUntilStale: 30
daysUntilClose: 7
exemptLabels:
  - security
  - high-priority
  - release
staleLabel: stale
markComment: |
  This pull request has been automatically marked as stale because it has not had recent activity.
  It will be closed in 7 days if no further activity occurs.

  To remove the stale label and prevent automatic closure:
  - Add a comment or push a commit
  - Apply the `keep-alive` label to exempt from stale checks
